<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#242527"><title>دخول الإدارة | Manal Store</title>
<link rel="stylesheet" href="./refined.css?v=14"><link rel="stylesheet" href="./components.css?v=14">
<script defer src="./data.js?v=14"></script><script defer src="./admin-auth.js?v=14"></script>
</head>
<body class="admin-auth-page">
<main class="admin-auth-card">
<a href="./index.html" class="admin-auth-brand" aria-label="العودة للمتجر"><img src="./assets/manalstorelogo.png" alt="Manal Store"></a>
<span class="admin-login-eyebrow">MANAL STORE · PRIVATE ACCESS</span>
<h1 id="authHeading">تسجيل دخول الإدارة</h1>
<p id="authDescription">لوحة مخصصة لمسؤول المتجر. أدخلي اسم المستخدم وكلمة المرور للمتابعة.</p>
<form id="adminAuthForm">
<div class="field"><label for="adminUsername">اسم المستخدم</label><input id="adminUsername" name="username" dir="ltr" autocomplete="username" required minlength="3" maxlength="32" spellcheck="false" placeholder="Username"></div>
<div class="field"><label for="adminPassword">كلمة المرور</label><div class="admin-password-wrap"><input id="adminPassword" name="password" type="password" autocomplete="current-password" required minlength="12" placeholder="••••••••••••"><button id="showAdminPassword" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button></div></div>
<p id="adminAuthError" class="form-error" role="alert"></p>
<button id="adminAuthSubmit" type="submit" class="button button-dark wide">الدخول إلى لوحة التحكم <span aria-hidden="true">←</span></button>
</form>
<p class="admin-auth-note">حساب إدارة واحد يُضبط من إعدادات المشروع؛ لا تتوفر خاصية إنشاء حساب مدير.</p>
<a class="admin-auth-return" href="./index.html">العودة إلى المتجر ←</a>
</main>
</body>
</html>
